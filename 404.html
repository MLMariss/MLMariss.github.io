  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);

  h1{font-size:2rem; margin:0 0 4px}

  ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
  a{display:block; text-decoration:none; color:var(--gold); font-weight:600;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px}
  a:hover,a:focus-visible{border-color:var(--gold); outline:none}
